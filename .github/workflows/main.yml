name: Update EPG

on:
  schedule:
    - cron: "0 4 * * *"   # every day at 04:00 UTC
  workflow_dispatch:       # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build UK EPG
        env:
          XTREAM_HOST: ${{ secrets.XTREAM_HOST }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
        run: python build_epg.py

      - name: Save uk.xml
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add uk.xml
          git diff --cached --quiet || git commit -m "Update EPG $(date -u +%F)"
          git push
